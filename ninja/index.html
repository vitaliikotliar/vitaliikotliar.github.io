const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

function render(lang) {
  const L = D[lang];
  document.documentElement.lang = lang;
  document.title = L.name;
  document.getElementById('title').textContent = L.name;
  document.getElementById('sub').textContent = L.sub;
  document.getElementById('note').textContent = L.note;
  document.getElementById('minliq').textContent = L.minliq;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('recipes').innerHTML = RECIPES.map((r, idx) => {
    const x = r[lang], n = r.n;
    return '<div class="recipe-card">' +
      '<div class="recipe-header"><h3 class="recipe-title">' + (idx + 1) + '. ' + esc(x.t) + '</h3><span class="mode-badge">' + esc(x.m) + '</span></div>' +
      '<div class="macros"><span>' + L.kcal + ': ~' + n.kc + '</span><span>' + L.p + ': ' + n.p + L.g + '</span><span>' + L.f + ': ' + n.f + L.g + '</span><span>' + L.c + ': ' + n.c + L.g + '</span><span>' + L.fib + ': ' + n.fib + L.g + '</span><span class="srv">' + L.srv + ' ' + n.srv + '</span></div>' +
      '<div class="section-title">' + L.ing + '</div><ul>' + x.i.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>' +
      '<div class="section-title">' + L.step + '</div><ol>' + x.s.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></div>';
  }).join('');
}
function setLang(lang) {
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render(lang);
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
let start = 'ru';
try { const s = localStorage.getItem('lang'); if (s && D[s]) start = s; } catch (e) {}
render(start);
</script>
